[tool.pyright]
# off , basic , standard , strict
typeCheckingMode = "standard"

exclude = [
    # Default
    "**/node_modules",
    "**/__pycache__",
    "**/.*",

    "venv",
]

ignore = [
    # Runtime, python libs
    "**/dist/**",
    "**/Lib/**",

    "tests",
    "**/launcher/*.py",
    "**/launcher/pages",
    "**/launcher/gui_parts",
    "**/launcher/components",
]

[tool.ruff]
extend-exclude = ["tests"]

lint.extend-select = ["I", "SIM", "B"]
